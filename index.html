<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10초 배달 리뷰 생성기</title>
    
    <!-- PWA 관련 설정 추가 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3B82F6">
    <link rel="apple-touch-icon" href="icon-192x192.png"> <!-- 아이폰용 앱 아이콘 -->
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        
        .star-active { fill: #FBBF24; color: #FBBF24; transition: all 0.2s ease-in-out; }
        .star-inactive { fill: #E5E7EB; color: #E5E7EB; transition: all 0.2s ease-in-out; }
        .chip { transition: all 0.2s ease; }
        
        @keyframes fadeinout {
            0%, 100% { opacity: 0; transform: translate(-50%, 20px); }
            10%, 90% { opacity: 1; transform: translate(-50%, 0); }
        }
        .toast-show {
            animation: fadeinout 2.5s forwards;
            display: flex !important;
        }
    </style>
</head>
<body class="text-gray-800 antialiased flex justify-center min-h-screen">

<div class="w-full max-w-md bg-white min-h-screen shadow-xl relative pb-24 overflow-y-auto">
    
    <div class="bg-white sticky top-0 z-10 px-5 py-4 border-b border-gray-100 backdrop-blur-md bg-opacity-90">
        <h1 class="text-xl font-bold text-center flex justify-center items-center gap-2">
            <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
            10초 배달 리뷰 생성기
        </h1>
    </div>

    <!-- Main Content -->
    <div class="p-5 space-y-8">

        <div class="space-y-3">
            <label class="block text-sm font-semibold text-gray-700">무엇을 드셨나요?</label>
            <input type="text" id="foodName" placeholder="예: 마라탕, 후라이드 치킨" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow text-base">
        </div>

        <div class="space-y-3">
            <label class="block text-sm font-semibold text-gray-700">수령 방식</label>
            <div class="flex p-1 bg-gray-100 rounded-xl">
                <button id="methodDelivery" class="method-btn flex-1 py-2.5 text-sm font-medium rounded-lg bg-white shadow-sm text-gray-800 transition-all">🛵 배달</button>
                <button id="methodTakeout" class="method-btn flex-1 py-2.5 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all">🛍️ 방문포장</button>
            </div>
        </div>

        <div class="space-y-3">
            <label class="block text-sm font-semibold text-gray-700">별점을 선택해주세요</label>
            <div class="flex items-center justify-center gap-2 bg-gray-50 py-4 rounded-xl border border-gray-100" id="starContainer"></div>
        </div>

        <div class="space-y-3">
            <label class="block text-sm font-semibold text-gray-700">어떤 점이 좋았나요? (다중 선택)</label>
            <div class="flex flex-wrap gap-2" id="keywordContainer">
                <button class="chip px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="양이 많아요">🥘 양이 많아요</button>
                <button class="chip px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="배달이 빠름">⚡ 배달이 빨라요</button>
                <button class="chip px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="맛있음">😋 맛있어요</button>
                <button class="chip px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="포장이 깔끔함">🎁 포장이 깔끔해요</button>
                <button class="chip px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="가성비가 좋음">💰 가성비가 좋아요</button>
                <button class="chip px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="요청사항 잘 들어줌">👂 요청사항을 잘 들어주셨어요</button>
                <button class="chip px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="따뜻하게 도착함">🔥 따뜻하게 왔어요</button>
            </div>
        </div>

        <div class="space-y-3">
            <label class="block text-sm font-semibold text-gray-700">어떤 점이 아쉬웠나요? (다중 선택)</label>
            <div class="flex flex-wrap gap-2" id="negativeKeywordContainer">
                <button class="chip-neg px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="양이 적어요">📉 양이 적어요</button>
                <button class="chip-neg px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="배달이 늦음">🐢 배달이 늦어요</button>
                <button class="chip-neg px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="맛이 아쉬움">😕 맛이 아쉬워요</button>
                <button class="chip-neg px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="포장이 훼손됨">💦 포장이 훼손됐어요</button>
                <button class="chip-neg px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="가성비가 아쉬움">💸 가성비가 아쉬워요</button>
                <button class="chip-neg px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="요청사항 누락">❌ 요청사항이 누락됐어요</button>
                <button class="chip-neg px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50" data-keyword="음식이 식음">❄️ 음식이 식어서 왔어요</button>
            </div>
        </div>

        <div id="resultSection" class="hidden mt-8 pt-6 border-t border-gray-200">
            <h3 class="text-sm font-bold text-blue-600 mb-3 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                AI가 작성한 리뷰
            </h3>
            
            <div id="loadingState" class="hidden flex-col items-center justify-center py-8 bg-blue-50 rounded-xl border border-blue-100">
                <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-blue-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-sm text-blue-600 font-medium animate-pulse">정성스러운 리뷰를 작성 중입니다...</p>
            </div>

            <div id="reviewOutputContainer" class="hidden">
                <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 text-gray-700 text-[15px] leading-relaxed whitespace-pre-wrap" id="reviewText"></div>
                <button id="copyBtn" class="mt-3 w-full flex items-center justify-center gap-2 py-3 bg-white border-2 border-gray-200 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 active:scale-[0.98] transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    리뷰 복사하기
                </button>
            </div>
        </div>

    </div>

    <!-- Fixed Bottom Action Area -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-white border-t border-gray-100 z-10">
        <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-lg">
            ✨ 리뷰 생성하기
        </button>
    </div>

    <!-- Custom Toast Message -->
    <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-full shadow-xl text-sm font-medium z-50 items-center gap-2 whitespace-nowrap">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMsg">복사되었습니다!</span>
    </div>

</div>

<script>
    // PWA 서비스 워커 등록
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful');
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }

    // State variables
    let currentMethod = '배달';
    let currentRating = 5;
    const selectedPositiveKeywords = new Set();
    const selectedNegativeKeywords = new Set();
    
    // DOM Elements
    const foodNameInput = document.getElementById('foodName');
    const btnDelivery = document.getElementById('methodDelivery');
    const btnTakeout = document.getElementById('methodTakeout');
    const starContainer = document.getElementById('starContainer');
    const posChips = document.querySelectorAll('.chip');
    const negChips = document.querySelectorAll('.chip-neg');
    const generateBtn = document.getElementById('generateBtn');
    
    const resultSection = document.getElementById('resultSection');
    const loadingState = document.getElementById('loadingState');
    const reviewOutputContainer = document.getElementById('reviewOutputContainer');
    const reviewText = document.getElementById('reviewText');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    // 1. Setup Stars
    function renderStars() {
        starContainer.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '1.5');
            svg.classList.add('w-10', 'h-10', 'cursor-pointer');
            
            if (i <= currentRating) {
                svg.classList.add('star-active');
            } else {
                svg.classList.add('star-inactive');
            }
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            path.setAttribute('d', 'M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z');
            svg.appendChild(path);
            
            svg.addEventListener('click', () => {
                currentRating = i;
                renderStars();
            });
            starContainer.appendChild(svg);
        }
    }
    renderStars();

    // 2. Setup Delivery Method Toggle
    function setMethod(method) {
        currentMethod = method;
        if (method === '배달') {
            btnDelivery.className = 'method-btn flex-1 py-2.5 text-sm font-medium rounded-lg bg-white shadow-sm text-gray-800 transition-all';
            btnTakeout.className = 'method-btn flex-1 py-2.5 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all';
        } else {
            btnTakeout.className = 'method-btn flex-1 py-2.5 text-sm font-medium rounded-lg bg-white shadow-sm text-gray-800 transition-all';
            btnDelivery.className = 'method-btn flex-1 py-2.5 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all';
        }
    }
    btnDelivery.addEventListener('click', () => setMethod('배달'));
    btnTakeout.addEventListener('click', () => setMethod('포장'));

    // 3. Setup Keyword Chips
    posChips.forEach(chip => {
        chip.addEventListener('click', () => {
            const keyword = chip.dataset.keyword;
            if (selectedPositiveKeywords.has(keyword)) {
                selectedPositiveKeywords.delete(keyword);
                chip.className = 'chip px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50';
            } else {
                selectedPositiveKeywords.add(keyword);
                chip.className = 'chip px-4 py-2 bg-blue-100 border border-blue-500 text-blue-700 rounded-full text-sm font-bold shadow-sm';
            }
        });
    });

    negChips.forEach(chip => {
        chip.addEventListener('click', () => {
            const keyword = chip.dataset.keyword;
            if (selectedNegativeKeywords.has(keyword)) {
                selectedNegativeKeywords.delete(keyword);
                chip.className = 'chip-neg px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-full text-sm font-medium hover:bg-gray-50';
            } else {
                selectedNegativeKeywords.add(keyword);
                chip.className = 'chip-neg px-4 py-2 bg-red-100 border border-red-500 text-red-700 rounded-full text-sm font-bold shadow-sm';
            }
        });
    });

    function showToast(message) {
        toastMsg.textContent = message;
        toast.classList.remove('hidden');
        toast.classList.add('toast-show');
        setTimeout(() => {
            toast.classList.remove('toast-show');
            toast.classList.add('hidden');
        }, 2500);
    }

    // 4. Generate Review
    generateBtn.addEventListener('click', async () => {
        const foodName = foodNameInput.value.trim() || '음식';
        
        resultSection.classList.remove('hidden');
        reviewOutputContainer.classList.add('hidden');
        loadingState.classList.remove('hidden');
        loadingState.classList.add('flex');
        
        setTimeout(() => {
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 100);

        let toneInstruction = "";
        if (currentRating >= 4) {
            toneInstruction = "별점이 4~5점이므로 아주 만족스럽고 기분 좋은 긍정적인 리뷰를 작성해줘.";
        } else if (currentRating === 3) {
            toneInstruction = "별점이 3점이므로 기대에는 못 미쳤거나 평범했다는 솔직한 리뷰를 작성해줘. 약간 아쉬운 점을 언급해도 좋아.";
        } else {
            toneInstruction = "별점이 1~2점이므로 음식이나 서비스에 매우 실망스럽고 불만이 있다는 부정적인 리뷰를 진지하게 작성해줘. 절대로 '너무 맛있어서 1점' 같은 반어법이나 장난스러운 칭찬을 쓰지 마. 진짜로 실망한 뉘앙스를 풍겨야 해.";
        }

        const posKeywordsStr = selectedPositiveKeywords.size > 0 ? Array.from(selectedPositiveKeywords).join(', ') : '없음';
        const negKeywordsStr = selectedNegativeKeywords.size > 0 ? Array.from(selectedNegativeKeywords).join(', ') : '없음';
        
        const systemPrompt = `너는 배달앱(배달의민족, 요기요 등)에 리뷰를 작성하는 한국의 20~30대 일반 소비자야. 딱딱한 AI 말투는 절대 금지. 친근하고 자연스러운 구어체(~해요, ~음/슴 등)를 써줘. 2~3문장 길이로 이모지 1~2개 섞어서 1개의 리뷰만 텍스트로 바로 출력해줘.`;
        
        const userPrompt = `다음 정보를 바탕으로 리뷰 작성해줘.
- 음식: ${foodName}
- 수령방식: ${currentMethod}
- 별점: ${currentRating}점(5점 만점)
- 좋았던 점: ${posKeywordsStr}
- 아쉬웠던 점: ${negKeywordsStr}

[필수 지시사항]
1. ${toneInstruction}
2. 선택한 '좋았던 점'과 '아쉬웠던 점'을 바탕으로 자연스럽게 문맥을 이어줘. 별점과 상충되는 특징이 있더라도 모두 포함하여 "XX는 좋았지만 OO는 아쉬웠다"처럼 문맥을 부드럽게 연결해줘.`;

        try {
            const apiKey = ""; // API Key handled automatically
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates.length > 0) {
                const generatedReview = data.candidates[0].content.parts[0].text;
                reviewText.textContent = generatedReview;
                
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
                reviewOutputContainer.classList.remove('hidden');
            } else {
                throw new Error('응답을 생성하지 못했습니다.');
            }

        } catch (error) {
            console.error('Error generating review:', error);
            loadingState.classList.add('hidden');
            loadingState.classList.remove('flex');
            showToast('리뷰 생성에 실패했어요. 잠시 후 다시 시도해주세요.');
        }
    });

    // 5. Copy to Clipboard
    copyBtn.addEventListener('click', () => {
        const textToCopy = reviewText.textContent;
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                showToast('리뷰가 복사되었습니다! 배달 앱에 붙여넣기 해주세요.');
            } else {
                showToast('복사에 실패했습니다.');
            }
        } catch (err) {
            console.error('Fallback: Oops, unable to copy', err);
            showToast('복사에 실패했습니다.');
        }
        
        document.body.removeChild(textArea);
    });

</script>
</body>
</html>
